
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1600 1000"
     fill="none">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="1000">
      <stop stop-color="#080e1b"/>
      <stop offset=".55" stop-color="#101c30"/>
      <stop offset="1" stop-color="#050a13"/>
    </linearGradient>

    <linearGradient id="line" x1="700" y1="200" x2="1500" y2="800">
      <stop stop-color="#256b80" stop-opacity=".1"/>
      <stop offset=".5" stop-color="#29c6bd" stop-opacity=".8"/>
      <stop offset="1" stop-color="#5487a5" stop-opacity=".15"/>
    </linearGradient>

    <radialGradient id="glow">
      <stop stop-color="#23c6b8" stop-opacity=".32"/>
      <stop offset="1" stop-color="#23c6b8" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="55" height="55"
             patternUnits="userSpaceOnUse">
      <path d="M55 0H0V55"
            stroke="#7993aa" stroke-opacity=".12"/>
    </pattern>

    <filter id="blur">
      <feGaussianBlur stdDeviation="45"/>
    </filter>

    <filter id="soft">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>

  <!-- Ambient lighting -->
  <ellipse cx="1250" cy="500" rx="500" ry="430"
           fill="url(#glow)" filter="url(#blur)"/>

  <!-- Network connections -->
  <g stroke="url(#line)" stroke-width="2">
    <path d="M750 220L960 350L1180 180L1390 330"/>
    <path d="M960 350L1080 570L1350 540L1510 720"/>
    <path d="M750 220L820 520L1080 570"/>
    <path d="M1180 180L1250 410L1390 330"/>
    <path d="M1250 410L1350 540L1450 870"/>
    <path d="M820 520L950 760L1080 570"/>
    <path d="M950 760L1190 850L1450 870"/>
    <path d="M1080 570L1190 850"/>
    <path d="M1390 330L1510 720"/>
    <path d="M1180 180L1450 870"/>
  </g>

  <!-- Secondary connections -->
  <g stroke="#4a718e" stroke-opacity=".35"
     stroke-width="1" stroke-dasharray="5 9">
    <path d="M750 220L1180 180L1350 540"/>
    <path d="M820 520L1390 330"/>
    <path d="M960 350L1450 870"/>
    <path d="M750 220L950 760"/>
  </g>

  <!-- Glowing nodes -->
  <g fill="#25c6b8">
    <circle cx="960" cy="350" r="9"/>
    <circle cx="1180" cy="180" r="7"/>
    <circle cx="1080" cy="570" r="10"/>
    <circle cx="1350" cy="540" r="8"/>
    <circle cx="820" cy="520" r="6"/>
    <circle cx="1390" cy="330" r="7"/>
    <circle cx="950" cy="760" r="6"/>
    <circle cx="1190" cy="850" r="7"/>
  </g>

  <g fill="#25c6b8" opacity=".3" filter="url(#soft)">
    <circle cx="960" cy="350" r="20"/>
    <circle cx="1080" cy="570" r="24"/>
    <circle cx="1350" cy="540" r="20"/>
    <circle cx="1180" cy="180" r="18"/>
  </g>

  <!-- Floating code panels -->
  <g stroke="#54758c" stroke-opacity=".5"
     fill="#111d30" fill-opacity=".8">
    <rect x="1100" y="285" width="235" height="125"
          rx="12" transform="rotate(-8 1100 285)"/>
    <rect x="1280" y="650" width="220" height="115"
          rx="12" transform="rotate(5 1280 650)"/>
    <rect x="760" y="640" width="175" height="100"
          rx="10" transform="rotate(-5 760 640)"/>
  </g>

  <!-- Abstract code lines -->
  <g stroke-linecap="round" stroke-width="4">
    <path d="M1125 320L1195 320"
          stroke="#25c6b8"/>
    <path d="M1125 345L1280 345"
          stroke="#68829a"/>
    <path d="M1125 370L1240 370"
          stroke="#68829a"/>
    <path d="M1300 690L1400 690"
          stroke="#25c6b8"/>
    <path d="M1300 715L1450 715"
          stroke="#68829a"/>
    <path d="M1300 740L1390 740"
          stroke="#68829a"/>
  </g>

  <!-- Decorative data trails -->
  <g stroke="#25c6b8" stroke-opacity=".4"
     stroke-width="2">
    <path d="M850 100Q1100 50 1300 120"/>
    <path d="M900 900Q1200 950 1500 820"/>
    <path d="M1050 100Q1300 20 1530 150"/>
  </g>

  <!-- Subtle left-side dark overlay for text -->
  <rect width="1600" height="1000"
        fill="url(#bg)" opacity=".28"/>
  <rect width="750" height="1000"
        fill="#080e1b" opacity=".62"/>

</svg>
